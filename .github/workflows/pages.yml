# Landing page: builds site/ (+ docs/screenshots, version from readme.txt)
# with `node scripts/site.js` and publishes it to GitHub Pages
# (https://rezwan2024.github.io/buddy-modules/).
#
# Runs on every push to dev that touches the page, the screenshots or
# readme.txt (a version bump updates the version shown on the page).

name: Pages

on:
  push:
    branches:
      - dev
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'readme.txt'
      - 'scripts/site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the page
        run: node scripts/site.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
